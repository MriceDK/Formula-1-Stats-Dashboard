<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="./images/F1-Logo.ico">
    <title>Formula 1 Stats Page</title>

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/script.js" type="module"></script>
    <script src=" https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js "></script>
    <script src=" https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>
<header>
    <img class="f1-logo" src="images/F1-Logo.png" alt="f1-logo">
    <h1>Formula 1 Stats</h1>
    <p class="switch">Add Result</p>
</header>
<main>
    <div class="box driver-select">
        <form class="search-driver-form">
            <label>
                Search Drivers
                <input class="driver-name" type="text">
            </label>
            <input type="submit" value="Search Driver">
            <label>
                Select Your Driver
                <select class="drivers">
                    <option>- Select Your Driver -</option>
                </select>
            </label>
        </form>
    </div>
    <section class="box driver-stats-simple hidden">
        <h2><span class="selected-driver-name"></span>'s stats</h2>
        <div class="normal-stats">
            <p id="races">Total Races: <span class="total-races">races</span> </p>
            <p id="win">Win Percentage: <span class="win-percentage">%</span></p>
            <p id="start">Avg Start Position: <span class="avg-quali-pos"></span></p>
            <p id="finish">Avg Finish Position: <span class="avg-finish-pos"></span></p>
            <p id="teammates">Win percentage against teammate: <span class="vs-teammates">%</span></p>

        </div>
    </section>
    <section class="box driver-stats-charts hidden">
        <h2><span class="selected-driver-name"></span>'s Performance Charts</h2>
        <div class="chart-container">
            <canvas id="driver-positions-chart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="points-per-season-chart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="driver-retirement-chart"></canvas>
        </div>
    </section>
    <form class="box new-result-form hidden">

        <h2 class="title">Add New Race Result</h2>

        <label>
            Season
            <input class="new-season input-text" type="text" required>
        </label>

        <label>
            Round
            <input class="new-season input-text" type="text" required>
        </label>

        <label>
            Race Name
            <input type="text" class="circuits input-text">
        </label>

        <label>
            Circuit
            <select class="circuits input-select">
                <option>- Select Circuit -</option>
            </select>
        </label>

        <label>
            Date
            <input class="new-date input-text" type="date" required>
        </label>

        <label>
            Search Drivers
            <input class="result-driver-name input-text" type="text">
        </label>

        <label>
            Select Driver
            <select class="drivers-result input-select">
                <option>- Select Your Driver -</option>
            </select>
        </label>

        <label>
            Select Contructor
            <select class="constructors-result input-select">
                <option>- Select Your Constructor -</option>
            </select>
        </label>

        <label>
            Qualifying Position
            <input class="new-quali-pos input-text" type="number" value="24" min="1" required>
        </label>

        <label>
            Finish Position
            <input class="new-finish-pos input-text" type="number" value="24" min="1" required>
        </label>

        <label>
            Points
            <input class="new-points input-text" type="number" value="0" min="0" required>
        </label>

        <label>
            Retired?
            <select class="new-retired input-select" required>
                <option value="false">No</option>
                <option value="true">Yes</option>
            </select>
            <input type="text" class="input-text new-retirement-reason" placeholder="Retirement Reason (if retired)">
        </label>

        <input type="submit" value="Add Result">
    </form>
</main>



</body>
</html>
