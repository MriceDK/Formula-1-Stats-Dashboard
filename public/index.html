<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="./images/F1-Logo.ico">
    <title>Formula 1 Stats Page</title>

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/script.js" type="module"></script>
    <script src=" https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js "></script>
    <script src=" https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <link rel="stylesheet" href=" https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin>
    <script src=" https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin></script>
</head>
<body>
<header>
    <img class="f1-logo" src="images/F1-Logo.png" alt="f1-logo">
    <h1>Formula 1 Stats</h1>
    <p class="switch">Add Driver</p>
</header>
<main>
    <div class="box driver-select">
        <form class="search-driver-form">
            <label>
                Search Drivers
                <input class="driver-name" type="text">
            </label>
            <input type="submit" value="Search Driver">
            <label>
                Select Your Driver
                <select class="drivers">
                    <option>- Select Your Driver -</option>
                </select>
            </label>
        </form>
    </div>
    <section class="box driver-stats-simple hidden">
        <h2><span class="selected-driver-name"></span>'s stats</h2>
        <div class="normal-stats">
            <p id="races">Total Races: <span class="total-races">races</span> </p>
            <p id="win">Win Percentage: <span class="win-percentage">%</span></p>
            <p id="start">Avg Start Position: <span class="avg-quali-pos"></span></p>
            <p id="finish">Avg Finish Position: <span class="avg-finish-pos"></span></p>
            <p id="teammates">Win percentage against teammate: <span class="vs-teammates">%</span></p>

        </div>
    </section>
    <section class="box driver-stats-charts hidden">
        <h2><span class="selected-driver-name"></span>'s Performance Charts</h2>
        <div class="chart-container">
            <canvas id="driver-positions-chart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="points-per-season-chart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="driver-retirement-chart"></canvas>
        </div>
    </section>
    <div class="add-driver hidden">
        <form class="box new-driver-form">

            <h2 class="title">Add New Driver</h2>

            <label>
                First Name*
                <input class="new-first-name input-text" type="text" required>
            </label>

            <label>
                Family Name*
                <input class="new-family-name input-text" type="text" required>
            </label>

            <label>
                nationality*
                <select class="input-select new-nationality" required>
                    <option  value="" disabled selected>Select Nationality</option>
                </select>
            </label>

            <label>
                Date of Birth*
                <input class="new-dob input-text" type="date" required>
            </label>
            <input type="submit" value="Add Result">
        </form>
        <div id="centra-map" class="map"></div>
    </div>
</main>



</body>
</html>
