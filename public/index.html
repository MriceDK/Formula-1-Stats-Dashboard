<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="./images/F1-Logo.ico">
    <title>Formula 1 Stats Page</title>

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/script.js" type="module"></script>
</head>
<body>
<header>
    <img class="f1-logo" src="images/F1-Logo.png" alt="f1-logo">
    <h1>Formula 1 Stats</h1>
</header>
<main>
    <div class="box driver-select">
        <form class="search-driver-form">
            <label>
                Search Drivers
                <input class="driver-name" type="text">
            </label>
            <input type="submit" value="Search Driver">
            <label>
                Select Your Driver
                <select class="drivers">
                    <option>- Select Your Driver -</option>
                </select>
            </label>
        </form>
    </div>
    <section class="box driver-stats">
        <h2><span class="selected-driver-name"></span>'s stats</h2>

    </section>
</main>

</body>
</html>
